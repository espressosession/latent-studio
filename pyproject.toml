[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "latent-studio"
version = "0.1.0"
description = "SD 1.5 image generation studio (Gradio) — Creative Coding Advanced capstone"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",  # required by transformers' AutoImageProcessor (ControlNet depth preprocessing)
    "diffusers>=0.27",
    "transformers>=4.41",
    "accelerate>=0.31",
    "peft>=0.11",
    "safetensors>=0.4",
    "gradio>=6.0",
    "pillow>=10.0",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Local LoRA-training deps (accelerate/peft/diffusers are already in the base
# deps). Enough to run training/run_local.py on MPS/CPU. bitsandbytes (8-bit
# Adam) and xformers are CUDA-only and unused off-CUDA, so they're installed
# only in the Colab training notebook, not here.
train = [
    "datasets>=2.19",
    "ftfy>=6.1",
    "requests>=2.31",
]

[tool.hatch.build.targets.wheel]
packages = ["src/latent_studio"]
